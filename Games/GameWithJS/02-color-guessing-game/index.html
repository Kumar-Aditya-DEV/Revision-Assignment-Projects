<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Master | RGB & HEX Color Guessing Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <nav class="arcade-nav">
        <a href="../../index.html" class="nav-back-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            <span>Arcade Hub</span>
        </a>
        <div class="nav-title">🎨 <span>Color Guessing Master</span></div>
        <button id="soundToggleBtn" class="sound-btn" title="Toggle Audio">🔊 Sound: ON</button>
    </nav>

    <div class="game-container">
        <header class="game-header">
            <div class="header-tag">THE GREAT COLOR CHALLENGE</div>
            <div class="color-code-display-card">
                <span class="code-label">Target Color Code</span>
                <div id="colorDisplay" class="color-code-value">RGB(?, ?, ?)</div>
            </div>
        </header>
        
        <div id="message" class="status-banner">Pick a color tile below!</div>
        
        <div class="stats-row">
            <div class="stat-pill">
                <span class="stat-lbl">Current Streak</span>
                <span id="currentStreak" class="stat-num">0</span>
            </div>
            <div class="stat-pill highlight">
                <span class="stat-lbl">Best Streak</span>
                <span id="bestStreak" class="stat-num">0</span>
            </div>
        </div>
        
        <div class="controls-bar">
            <button id="newRoundBtn" class="btn btn-action">🎲 New Round</button>
            <div class="format-toggle">
                <button class="fmt-btn active" data-fmt="RGB">RGB</button>
                <button class="fmt-btn" data-fmt="HEX">HEX</button>
            </div>
            <div class="diff-toggle">
                <button class="diff-btn" data-count="3">Easy (3)</button>
                <button class="diff-btn active" data-count="6">Med (6)</button>
                <button class="diff-btn" data-count="9">Hard (9)</button>
            </div>
            <button id="resetStreakBtn" class="btn btn-secondary">🔄 Reset</button>
        </div>
        
        <div id="colorBoxContainer" class="color-grid count-6">
            <!-- Dynamically generated or template boxes -->
        </div>
    </div>
    
    <script src="./script.js"></script>
</body>
</html>
