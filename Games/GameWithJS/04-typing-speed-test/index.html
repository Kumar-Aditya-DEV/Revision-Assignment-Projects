<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberTypist | Typing Speed Test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <nav class="arcade-nav">
        <a href="../../index.html" class="nav-back-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            <span>Arcade Hub</span>
        </a>
        <div class="nav-title">⌨️ <span>CyberTypist Speed Test</span></div>
        <button id="soundToggleBtn" class="sound-btn" title="Toggle Audio">🔊 Sound: ON</button>
    </nav>

    <div class="game-container">
        <header class="game-header">
            <h1>⌨️ CyberTypist Challenge</h1>
            <p class="subtitle">Test your typing speed (WPM) & precision accuracy!</p>
        </header>

        <div class="stats-bar">
            <div class="stat-card">
                <div class="card-lbl">Time Left</div>
                <div id="timer" class="card-val">60s</div>
            </div>
            <div class="stat-card highlight">
                <div class="card-lbl">WPM</div>
                <div id="wpm" class="card-val">0</div>
            </div>
            <div class="stat-card">
                <div class="card-lbl">Accuracy</div>
                <div id="accuracy" class="card-val">100%</div>
            </div>
            <div class="stat-card">
                <div class="card-lbl">Best WPM</div>
                <div id="bestWPM" class="card-val">0</div>
            </div>
        </div>

        <div class="config-bar">
            <div class="config-group">
                <span class="cfg-label">Timer:</span>
                <button class="sec-btn" data-time="15">15s</button>
                <button class="sec-btn" data-time="30">30s</button>
                <button class="sec-btn active" data-time="60">60s</button>
            </div>
            <div class="config-group">
                <span class="cfg-label">Mode:</span>
                <button class="cat-btn active" data-cat="quotes">Quotes</button>
                <button class="cat-btn" data-cat="code">Code</button>
                <button class="cat-btn" data-cat="tech">Tech</button>
            </div>
        </div>

        <div class="text-display-box" id="textDisplay">
            Click "Start Test" or start typing below to begin!
        </div>

        <textarea id="typingArea" placeholder="Start typing here when test begins..." disabled></textarea>

        <div class="action-buttons">
            <button id="startBtn" class="btn btn-primary">🚀 Start Test</button>
            <button id="resetBtn" class="btn btn-secondary">🔄 Reset Session</button>
        </div>

        <div id="encouragement" class="status-msg">
            Ready? Choose your time limit and hit Start Test!
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
