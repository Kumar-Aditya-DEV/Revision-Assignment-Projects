<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Memory Flip Master | Arcade Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    <nav class="arcade-nav">
        <a href="../../index.html" class="nav-back-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            <span>Arcade Hub</span>
        </a>
        <div class="nav-title">🃏 <span>Memory Flip Card Master</span></div>
        <button id="soundToggleBtn" class="sound-btn" title="Toggle Audio">🔊 Sound: ON</button>
    </nav>

    <div class="game-container">
        <header class="game-header">
            <h1>🃏 Memory Flip Card Game</h1>
            <p class="subtitle">Match all identical pairs before the time runs out!</p>
        </header>

        <div class="stats-row">
            <div class="stat-pill">
                <span class="lbl">Moves</span>
                <span id="moves" class="val">0</span>
            </div>
            <div class="stat-pill">
                <span class="lbl">Matched</span>
                <span id="pairs" class="val">0 / 9</span>
            </div>
            <div class="stat-pill">
                <span class="lbl">Time Left</span>
                <span id="timeLeft" class="val">60s</span>
            </div>
            <div class="stat-pill highlight">
                <span class="lbl">Best Score</span>
                <span id="bestScore" class="val">-</span>
            </div>
        </div>

        <div class="controls-bar">
            <div class="btn-group">
                <button id="startBtn" class="btn btn-primary">🚀 Start</button>
                <button id="restartBtn" class="btn btn-warning">🔄 Restart</button>
                <button id="resetBtn" class="btn btn-danger">🗑️ Reset Best</button>
            </div>
            <div class="theme-select">
                <span class="select-label">Theme:</span>
                <button class="theme-btn active" data-theme="food">🍕 Food</button>
                <button class="theme-btn" data-theme="tech">💻 Tech</button>
                <button class="theme-btn" data-theme="animals">🦁 Animals</button>
            </div>
        </div>

        <div id="statusMsg" class="status-banner">Select a theme & hit Start!</div>

        <div class="board" id="board">
            <!-- Dynamic 3D Flipped Cards -->
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
