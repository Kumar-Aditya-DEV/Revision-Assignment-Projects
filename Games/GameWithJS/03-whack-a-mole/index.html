<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack-a-Mole | Arcade Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script>
        if (window.location.pathname.length > 1 && !window.location.pathname.endsWith('/') && !window.location.pathname.endsWith('.html')) {
            window.location.replace(window.location.pathname + '/' + window.location.search + window.location.hash);
        }
    </script>
    <link rel="stylesheet" href="/GameWithJS/03-whack-a-mole/style.css">
</head>
<body>
    <nav class="arcade-nav">
        <a href="/" class="nav-back-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            <span>Arcade Hub</span>
        </a>
        <div class="nav-title">🔨 <span>Whack-A-Mole</span></div>
        <button id="soundToggleBtn" class="sound-btn" title="Toggle Audio">🔊 Sound: ON</button>
    </nav>

    <div class="game-container">
        <header class="game-header">
            <h1>🔨 Cyber Whack-a-Mole</h1>
            <p class="subtitle">Whack moles! Watch out for bombs 💣 & grab golden moles ⭐!</p>
        </header>

        <div class="legend-bar">
            <span class="legend-item">🐹 Mole (+10)</span>
            <span class="legend-item gold">⭐ Gold (+25)</span>
            <span class="legend-item bomb">💣 Bomb (-15)</span>
        </div>

        <div class="scoreboard">
            <div class="score-card">
                <div class="card-label">Score</div>
                <div id="score" class="card-value">0</div>
            </div>
            <div class="score-card">
                <div class="card-label">Time</div>
                <div id="timeLeft" class="card-value">30s</div>
            </div>
            <div class="score-card">
                <div class="card-label">Hits</div>
                <div id="hits" class="card-value">0</div>
            </div>
            <div class="score-card highlight">
                <div class="card-label">Best</div>
                <div id="maxScore" class="card-value">0</div>
            </div>
        </div>

        <div class="controls-row">
            <button id="startBtn" class="btn btn-start">🚀 Start Game</button>
            <button id="pauseBtn" class="btn btn-pause" disabled>⏸️ Pause</button>
            <button id="resetBtn" class="btn btn-reset">🔄 Reset Best</button>
            <div class="diff-select">
                <button class="diff-btn" data-speed="1000">Easy</button>
                <button class="diff-btn active" data-speed="750">Medium</button>
                <button class="diff-btn" data-speed="500">Hard</button>
            </div>
        </div>

        <div id="statusMsg" class="status-banner">Ready? Click Start Game!</div>

        <div class="game-board">
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
        </div>
    </div>

    <script src="/GameWithJS/03-whack-a-mole/script.js"></script>
</body>
</html>
